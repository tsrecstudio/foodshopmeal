name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  migrations-and-compose:
    name: Flyway Migrations (PG16+pgvector) & Compose Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: foodshop
          POSTGRES_USER: foodshop
          POSTGRES_PASSWORD: foodshop_ci_pwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U foodshop -d foodshop"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Run Flyway migrations
        run: |
          docker run --rm --network host \
            -v "${PWD}/db/migrations:/flyway/sql:ro" \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://127.0.0.1:5432/foodshop \
            -user=foodshop \
            -password=foodshop_ci_pwd \
            -defaultSchema=core \
            -schemas=core,identity_pii,catalog,fulfillment \
            migrate

      - name: Verify pgvector extension, 152-FZ schemas, and default L1 flags
        env:
          PGPASSWORD: foodshop_ci_pwd
        run: |
          psql -h 127.0.0.1 -U foodshop -d foodshop -v ON_ERROR_STOP=1 -c \
            "SELECT extname FROM pg_extension WHERE extname IN ('vector', 'pgcrypto');"
          psql -h 127.0.0.1 -U foodshop -d foodshop -v ON_ERROR_STOP=1 -c \
            "SELECT flag_key, enabled FROM core.feature_flags ORDER BY flag_key;"

  solver-svc:
    name: Solver Service (Python 3.11 + OR-Tools CP-SAT)
    runs-on: ubuntu-latest
    needs: migrations-and-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install solver-svc & dev dependencies
        working-directory: services/solver-svc
        run: pip install -e ".[dev]"

      - name: Run pytest
        working-directory: services/solver-svc
        run: pytest -v

  core-api:
    name: Core API (Kotlin 2.0 + Spring Boot 3.3 + ArchUnit)
    runs-on: ubuntu-latest
    needs: migrations-and-compose
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build and run unit & architecture tests
        working-directory: services/core-api
        run: gradle test --no-daemon
