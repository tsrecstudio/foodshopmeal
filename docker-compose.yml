name: foodshopmeal

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fsm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodshop}
      POSTGRES_USER: ${POSTGRES_USER:-foodshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodshop_dev_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  flyway:
    image: flyway/flyway:10-alpine
    container_name: fsm-flyway
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foodshop}
      - -user=${POSTGRES_USER:-foodshop}
      - -password=${POSTGRES_PASSWORD:-foodshop_dev_pwd}
      - -defaultSchema=core
      - -schemas=core,identity_pii,catalog,fulfillment
      - -connectRetries=15
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: fsm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fsm-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foodshop_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foodshop_minio_pwd}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    container_name: fsm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-foodshop_minio} $${MINIO_ROOT_PASSWORD:-foodshop_minio_pwd} &&
      mc mb --ignore-existing local/$${S3_BUCKET_CATALOG_FEEDS:-catalog-feeds} &&
      mc mb --ignore-existing local/$${S3_BUCKET_WEBHOOK_ARCHIVE:-webhook-raw-archive}
      "

  kafka:
    image: apache/kafka:3.8.0
    container_name: fsm-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: fsm-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-foodshop_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-foodshop_ch}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-foodshop_ch_pwd}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/docker/clickhouse-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: fsm-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

  solver-svc:
    build:
      context: ./services/solver-svc
      dockerfile: Dockerfile
    container_name: fsm-solver-svc
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodshop}:${POSTGRES_PASSWORD:-foodshop_dev_pwd}@postgres:5432/${POSTGRES_DB:-foodshop}
      CHECK_DB_ON_READINESS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      ENVIRONMENT: local
    ports:
      - "${SOLVER_SVC_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    container_name: fsm-core-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-foodshop}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-foodshop}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-foodshop_dev_pwd}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      FSM_S3_ENDPOINT: http://minio:9000
      FSM_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-foodshop_minio}
      FSM_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-foodshop_minio_pwd}
      FSM_S3_BUCKET_FEEDS: ${S3_BUCKET_CATALOG_FEEDS:-catalog-feeds}
      FSM_SOLVER_BASE_URL: http://solver-svc:8000
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes:
      - ./db/migrations:/app/db/migrations:ro
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      solver-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clickhouse_data:
